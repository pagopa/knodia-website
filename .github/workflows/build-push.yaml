name: "Build and Push"
on:
  push:
    branches:
      - "develop"
    tags:
      - "*"
    paths:
      - "public/**"
      - "src/**"
      - ".github/workflows/build-push.yaml"

jobs:
  build_push:
    name: Build and push
    runs-on: ubuntu-latest
    environment: ${{ github.ref_type == 'branch' && github.ref == 'refs/heads/develop' && 'dev' || github.ref_type == 'tag' && 'prod' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ./package.json
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          run_install: true

      - name: Build project
        run: pnpm build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.IAM_ROLE_ARN }}
          role-session-name: knodia-website-invalidate-cloudfront-distribution

      - name: Push to S3 bucket
        env:
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
        run: |
          set -euo pipefail

          aws s3 sync ./dist "s3://${S3_BUCKET_NAME}/" --delete

      - name: Invalidate CloudFront Distribution
        env: 
          CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}
          CF_INVALIDATION_PATHS: ${{ vars.CF_INVALIDATION_PATHS }}
        run: |
          set -euo pipefail

          aws cloudfront create-invalidation \
            --distribution-id "${CF_DISTRIBUTION_ID}" \
            --paths ${CF_INVALIDATION_PATHS}    #space separated paths